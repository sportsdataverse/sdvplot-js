name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    # tsc and tsup's dts worker type-check the ~20 MB of generated data shards. patches/tsup@8.5.1.patch makes the
    # dts worker build one ts.Program instead of one per entry directory: the build peaks ~3 GB at any entry count.
    env: { NODE_OPTIONS: "--max-old-space-size=8192" }
    strategy: { fail-fast: false, matrix: { node: [20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm vendor --check
      - run: pnpm codegen --check
      - run: pnpm build:index --check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm pack:check
      - run: pnpm docs:build
      - run: pnpm --filter docs typecheck
  # Non-gating: real Chromium on the built docs (examples/test/interactive.test.ts) proves each Plotly, Vega, ECharts
  # and Chart.js example is drawn by its library in the browser, with an accessible name and no console error. Its
  # own job, as sdvtables' render tests: Chromium stays out of `check` and out of the Vercel build. It needs the
  # network (the charts load logos from the CDN), which is one more reason it cannot gate.
  docs-render:
    runs-on: ubuntu-latest
    needs: [check]
    continue-on-error: true
    # measured locally: docs build ~5 min, the 17 pages ~35 s, plus install and chromium
    timeout-minutes: 25
    env: { NODE_OPTIONS: "--max-old-space-size=8192" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportsdataverse/examples exec playwright install --with-deps chromium
      - run: pnpm docs:build
      - run: pnpm --filter @sportsdataverse/examples exec vitest run test/interactive.test.ts
        env: { SDV_RENDER_TESTS: "1", SDV_RENDER_SHOTS: "${{ github.workspace }}/interactive-shots" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        # overwrite: a "Re-run jobs" uploads under the same name instead of failing with a conflict
        with: { name: docs-interactive-shots, path: interactive-shots/, if-no-files-found: warn, overwrite: true }
