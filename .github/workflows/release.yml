name: release
on: { push: { branches: [main] } }
permissions: { contents: write, pull-requests: write, id-token: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      # changeset status needs a local `main`; this push-to-main checkout has one, a pull_request checkout does not.
      - run: node scripts/check-release-plan.mjs
      - uses: changesets/action@v1
        with: { publish: pnpm release, version: pnpm version-packages, commit: "chore(release): version packages", title: "chore(release): version packages" }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", NPM_CONFIG_PROVENANCE: "true", NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
